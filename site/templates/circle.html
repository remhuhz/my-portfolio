{% extends "base.html" %}
{% block title %}Area of a Circle{% endblock %}
{% block content %}
<section class="panel narrow">
  <a class="back" href="/works">All works</a>
  <p class="tag">Math</p>
  <h1>Area of a circle</h1>
  <form action="/works/area/circle" method="post">
    <label for="radius">Enter a radius</label>
    <input type="number" step="any" min="0" id="radius" name="radius" required>
    <button class="btn" type="submit">Compute</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if result is not none %}<div class="result"><span>Area of the circle</span><b>{{ result }}</b></div>{% endif %}
</section>
{% endblock %}
