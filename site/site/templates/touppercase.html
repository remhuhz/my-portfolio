{% extends "base.html" %}
{% block title %}toUpperCase{% endblock %}
{% block content %}
<section class="panel narrow">
  <a class="back" href="/works">All works</a>
  <p class="tag">Strings</p>
  <h1>Convert string to uppercase</h1>
  <form action="/works/uppercase" method="post">
    <label for="inputString">Enter a string</label>
    <input type="text" id="inputString" name="inputString" autocomplete="off" required>
    <button class="btn" type="submit">Convert</button>
  </form>
  {% if result is not none %}<div class="result"><span>Converted string</span><b>{{ result }}</b></div>{% endif %}
</section>
{% endblock %}
